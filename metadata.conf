# Release metadata - the ONE file you edit before a release.
#
# src/deploy.sh reads this file and prepares everything else:
#   * stamps jellyfin-plugin/build.yaml (version, guid, targetAbi, catalog
#     fields) and core/pyproject.toml (version, description, authors, license,
#     urls) - idempotent, so a re-run never dirties git;
#   * builds the plugin zip + manifest.json and the pipx sdist/wheel (in Docker)
#     into <repo>/dist/. Push tag v<version> to publish everything (GitHub
#     Actions releases + manifest.json + PyPI); twine upload stays as fallback.
#
# Rules:
#   * one `key = value` per line, values are single-line;
#   * "|" inside a value is a line break in the generated output
#     (plugin catalog description/changelog);
#   * [project] name is the display name; the PyPI slug (thabit-translator)
#     lives in core/pyproject.toml and is NOT stamped.

[project]
name = Thabit Translator
version = 0.0.3.0
maintainer = mbnoimi
email = mbnoimi@gmail.com
homepage = https://github.com/mbnoimi/thabit-translator
license = LGPL-3.0-only
copyright = 2025-2026 mbnoimi
summary = CPU-only subtitle automation: download, extract, translate and transcribe subtitles

[plugin]
guid = 993545e6-8c2c-4074-bec4-8af2a39a976b
name = Thabit Translator
owner = mbnoimi
category = Media playback
target_abi = 10.11.0.0
overview = Fetch, extract and translate subtitles using the ThabitTranslator library.
description_long = Adds a "Thabit Translator" subtitle provider to Jellyfin's per-item download | menu plus a scheduled task that sweeps libraries and fills in missing | subtitles. The heavy lifting (subtitle download providers, embedded-track | extraction, Argos translation, Vosk speech-to-text) is done by the bundled | ThabitTranslator Python library, which the plugin runs standalone: the | library's sources are embedded in the plugin DLL, and it is executed with the | server's python3 or, when none is installed (as in the official Jellyfin | container image), a pinned portable CPython that the plugin downloads into | its data folder on first use. No custom Jellyfin image is required.
changelog = Standalone runtime: the plugin now runs on the official Jellyfin image | with no Python present - it auto-downloads a pinned portable CPython into its | data folder and bootstraps its own virtualenv. Removes the custom-image | requirement entirely.
