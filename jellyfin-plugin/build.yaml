name: Thabit Translator
guid: 993545e6-8c2c-4074-bec4-8af2a39a976b
version: 0.0.2.1
targetAbi: 10.11.0.0
framework: net9.0
overview: Fetch, extract and translate subtitles using the ThabitTranslator library.
description: >
  Adds a "Thabit Translator" subtitle provider to Jellyfin's per-item download
  menu plus a scheduled task that sweeps libraries and fills in missing
  subtitles. The heavy lifting (subtitle download providers, embedded-track
  extraction, Argos translation, Vosk speech-to-text) is done by the bundled
  ThabitTranslator Python library, which runs inside the container image.
owner: mbnoimi
category: Media playback
artifacts:
  - Jellyfin.Plugin.ThabitTranslator.dll
changelog: >
  0.0.2.1: Initial release - subtitle provider, library sweep scheduled task, configuration page and status API.
