services:
  # Compile/test toolchain (Dockerfile.builder = .NET SDK + jprm), NOT a
  # Jellyfin image. The runtime pipeline uses only the stock jellyfin service.
  plugin-build:
    build:
      context: .
      dockerfile: Dockerfile.builder
    command:
      - sh
      - -lc
      # Restore first: jprm runs `dotnet clean` before its own restore, and
      # clean fails with NETSDK1064 if the nuget-cache volume was wiped while
      # the bind-mounted obj/ still claims a successful restore.
      - dotnet restore --force --no-cache && jprm plugin build . -o /out && chown -R ${UID}:${GID} /out
    volumes:
      - ".:/src"
      # The csproj embeds ../../../core/**; inside the container that resolves
      # to /core, so the real src/core must be mounted there (read-only -
      # only *.py is ever embedded, never thabit_translator.conf).
      - "../core:/core:ro"
      - "./artifacts:/out"
      - nuget-cache:/root/.nuget/packages
    environment:
      PATH: "/root/.dotnet/tools:${PATH}"

  plugin-test:
    build:
      context: .
      dockerfile: Dockerfile.builder
    command: ["dotnet", "test", "-c", "Release"]
    volumes:
      - ".:/src"
      - "../core:/core:ro"
      - nuget-cache:/root/.nuget/packages

  # Stock official instance - deliberately NOT a custom image: the plugin must
  # run on any Jellyfin 10.11+ the user already has. ./test.sh unpacks the
  # freshly built zip into jf-config/plugins/ before starting this, which is
  # exactly the "manual copy" install from the README.
  jellyfin:
    image: jellyfin/jellyfin:10.11
    labels:
      # WUD (What's Up Docker) on this host keeps "updating" this service to a
      # stale nightly image; the plugin must be tested against the stock image,
      # so opt the container out of its watch.
      wud.watch: "false"
    user: "${UID}:${GID}"
    ports:
      - "8096:8096"
    volumes:
      - "./jf-config:/config"
      - "./jf-cache:/cache"
      - "${MEDIA_ROOT:-./media-test}:/media:rw"
    restart: unless-stopped

volumes:
  nuget-cache:
